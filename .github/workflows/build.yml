name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JDK 17 is the bytecode target; AGP itself runs happily on it.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The action's default package list still names the old "tools" package, which Google
        # removed from the SDK repository in September 2026, and sdkmanager then fails the whole
        # step. platform-tools is all this needs to install; Gradle fetches the rest itself.
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Cheap wiring checks first: they fail in a second rather than after a full compile.
      - name: Static checks
        run: python3 tools/verify.py

      # No keystore.properties in CI, so the release build stays unsigned — which is
      # exactly what we want to verify: that the project compiles for anyone.
      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seamless-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
