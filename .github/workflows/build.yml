name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JDK 17 is the bytecode target; AGP itself runs happily on it.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The action's default package list still names the old "tools" package, which Google
        # removed from the SDK repository in September 2026, and sdkmanager then fails the whole
        # step. platform-tools is all this needs to install; Gradle fetches the rest itself.
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Cheap wiring checks first: they fail in a second rather than after a full compile.
      - name: Static checks
        run: python3 tools/verify.py

      # No keystore.properties in CI, so the release build stays unsigned — which is
      # exactly what we want to verify: that the project compiles for anyone.
      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      # A failing lint run prints only its first few problems, so each fix used to reveal the
      # next few. List every error on the run's summary page, and as annotations, so a red build
      # says everything that is wrong at once.
      - name: Summarise lint errors
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "app/build/reports/lint-results-debug.xml"
          if not os.path.exists(path):
              raise SystemExit(0)
          issues = [i for i in ET.parse(path).getroot().iter("issue")
                    if i.get("severity") in ("Error", "Fatal")]
          lines = ["### Lint: %d error(s)" % len(issues), ""]
          for n, issue in enumerate(issues):
              loc = issue.find("location")
              file = os.path.relpath(loc.get("file"), os.getcwd()) if loc is not None else "?"
              line = loc.get("line", "1") if loc is not None else "1"
              message = issue.get("message", "").replace("\n", " ")
              lines.append("- `%s:%s` **%s** %s" % (file, line, issue.get("id"), message))
              level = "error" if n < 10 else "warning" if n < 20 else "notice"
              print("::%s file=%s,line=%s::[%s] %s" % (level, file, line, issue.get("id"), message))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(lines) + "\n")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seamless-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
